name: Telegram Bot Runner

on:
  schedule:
    # يعمل تلقائياً كل 5 ساعات ليضمن استمرارية البوت 24/7 دون توقف
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Ultra-Light Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot PyMuPDF img2pdf

      - name: Run Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python bot.py
